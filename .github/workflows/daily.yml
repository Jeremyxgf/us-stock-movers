name: Daily snapshot & deploy

on:
  schedule:
    # 22:30 UTC，周一至周五 —— 美股收盘（20:00/21:00 UTC）后约 1.5-2.5 小时。
    - cron: "30 22 * * 1-5"
    # 08:00 UTC = 北京 16:00，A 股 15:00 收盘后 —— 抓 A 股快照（此时北京日期即交易日）。
    - cron: "0 8 * * 1-5"
  workflow_dispatch: {}          # 也可在 Actions 页手动触发
  push:
    branches: [main]
    paths-ignore:
      - "data/**"                # 数据由本工作流自身提交；改网页(index.html)等才需重新部署

# contents: 提交每日数据；pages + id-token: 部署 GitHub Pages（Source = GitHub Actions）
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时刻只跑一个部署，且不打断进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只有定时/手动触发才抓数据；因编辑网页而 push 时跳过，直接重新部署当前内容
      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch snapshot
        if: github.event_name != 'push'
        run: python3 fetch_snapshot.py

      - name: Fetch intraday volatility
        if: github.event_name != 'push'
        run: python3 fetch_intraday.py

      - name: Fetch high/low history
        if: github.event_name != 'push'
        run: python3 fetch_highlow.py

      - name: Build sector correlations
        if: github.event_name != 'push'
        run: python3 fetch_sectors.py

      # A 股：只在 08:00 UTC 的 CN 定时任务或手动触发时跑（此时北京日期=交易日）
      # 数据源均为新浪/腾讯（抗封）；highlow/intraday 依赖 snapshot，须在其后。
      - name: Fetch A-share snapshot
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1-5')
        run: python3 cn_fetch_snapshot.py

      - name: Fetch A-share high/low history
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1-5')
        run: python3 cn_fetch_highlow.py

      - name: Fetch A-share intraday
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1-5')
        run: python3 cn_fetch_intraday.py

      - name: Commit data if changed
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "没有新数据，跳过提交。"
          else
            git commit -m "data: snapshot $(date -u +%F)"
            git push
          fi

      # 组装要发布的静态站点（只含网页与数据，不带 .git，体积小、部署快）
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp intraday.html _site/
          cp highlow.html _site/
          cp sectors.html _site/
          cp stock.html _site/
          cp reversal.html _site/
          cp cn-index.html _site/
          cp cn-highlow.html _site/
          cp cn-reversal.html _site/
          cp cn-stock.html _site/
          cp cn-intraday.html _site/
          cp -r data _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      # GitHub Pages 的部署接口偶发 "Deployment failed, try again later."（GitHub 侧瞬时问题）。
      # 单次失败就整单失败会导致某些天不部署，故最多重试 3 次。
      - name: Deploy attempt 1
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45

      - name: Deploy attempt 2
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: Deploy attempt 3 (final)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
